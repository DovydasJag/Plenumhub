name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build site
        run: |
          python build.py \
            --name "PlenumHub" \
            --domain https://plenumhub.com \
            --email dovydasjagm@gmail.com \
            --operator "Dovydas Jagminas" \
            --address "Aukštagirio g. 18, Vilnius, 10105" \
            --country Lithuania \
            --host "GitHub Pages"

      - name: Add CNAME for custom domain
        run: echo "plenumhub.com" > dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
